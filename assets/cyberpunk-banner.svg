<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="nameClip">
      <rect x="72" y="88" width="800" height="90"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- VERY SUBTLE GRID -->
  <g opacity="0.09" stroke="#FCEE0A" stroke-width="1">
    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M160 0V300"/>
    <path d="M320 0V300"/>
    <path d="M480 0V300"/>
    <path d="M640 0V300"/>
    <path d="M800 0V300"/>
    <path d="M960 0V300"/>
  </g>

  <!-- YELLOW CYBERPUNK SHAPE -->
  <path d="M0 0H440L405 18H0V0Z" fill="#FCEE0A"/>
  <path d="M1200 300H760L795 282H1200V300Z" fill="#FCEE0A"/>

  <!-- RED ACCENTS -->
  <path d="M0 34H210" stroke="#FF2E3F" stroke-width="4"/>
  <path d="M990 266H1200" stroke="#FF2E3F" stroke-width="4"/>
  <path d="M1082 34H1140L1164 58" stroke="#FF2E3F" stroke-width="2" opacity="0.9"/>
  <rect x="1080" y="70" width="84" height="2" fill="#FF2E3F" opacity="0.75"/>

  <!-- LABELS -->
  <text x="72" y="68" fill="#FCEE0A"
        font-family="Consolas, Menlo, Monaco, monospace"
        font-size="15" font-weight="700" letter-spacing="4">
    PROFILE // 01
  </text>

  <text x="1090" y="102" fill="#A7A7A7"
        font-family="Consolas, Menlo, Monaco, monospace"
        font-size="11" letter-spacing="2">
    LNK
  </text>

  <!-- NAME -->
  <g clip-path="url(#nameClip)">
    <text x="68" y="158" fill="#FCEE0A" opacity="0"
          font-family="Consolas, Menlo, Monaco, monospace"
          font-size="72" font-weight="900" letter-spacing="1">
      ANTONIO NAVARRO
      <animate attributeName="opacity"
               values="0;0;0.65;0;0"
               keyTimes="0;0.82;0.84;0.86;1"
               dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
               values="-6 0;-6 0;7 0;-3 0;-6 0"
               keyTimes="0;0.82;0.84;0.86;1"
               dur="7s" repeatCount="indefinite"/>
    </text>

    <text x="76" y="158" fill="#FF2E3F" opacity="0"
          font-family="Consolas, Menlo, Monaco, monospace"
          font-size="72" font-weight="900" letter-spacing="1">
      ANTONIO NAVARRO
      <animate attributeName="opacity"
               values="0;0;0.55;0;0"
               keyTimes="0;0.825;0.845;0.865;1"
               dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
               values="5 0;5 0;-7 0;4 0;5 0"
               keyTimes="0;0.825;0.845;0.865;1"
               dur="7s" repeatCount="indefinite"/>
    </text>

    <text x="72" y="158" fill="#F4F4F4"
          font-family="Consolas, Menlo, Monaco, monospace"
          font-size="72" font-weight="900" letter-spacing="1">
      ANTONIO NAVARRO
    </text>
  </g>

  <!-- TITLE -->
  <rect x="72" y="187" width="18" height="4" fill="#FF2E3F"/>
  <text x="102" y="194" fill="#FCEE0A"
        font-family="Consolas, Menlo, Monaco, monospace"
        font-size="17" font-weight="700" letter-spacing="4">
    SOFTWARE ENGINEER
  </text>

  <text x="72" y="229" fill="#9B9B9B"
        font-family="Consolas, Menlo, Monaco, monospace"
        font-size="13" letter-spacing="3">
    AI  //  HEALTHTECH  //  PRODUCT
  </text>

  <!-- STATUS -->
  <circle cx="1001" cy="206" r="5" fill="#FF2E3F" filter="url(#softGlow)">
    <animate attributeName="opacity"
             values="1;0.25;1"
             dur="1.8s"
             repeatCount="indefinite"/>
  </circle>
  <text x="1018" y="211" fill="#CFCFCF"
        font-family="Consolas, Menlo, Monaco, monospace"
        font-size="12" letter-spacing="2">
    ONLINE
  </text>

  <!-- MOVING SCAN LINE -->
  <rect x="0" y="0" width="1200" height="2" fill="#FF2E3F" opacity="0">
    <animate attributeName="y" values="20;278" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.18;0.18;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- SMALL DECORATION -->
  <g opacity="0.55" fill="#FCEE0A">
    <rect x="1010" y="235" width="62" height="3"/>
    <rect x="1078" y="235" width="20" height="3"/>
    <rect x="1104" y="235" width="10" height="3"/>
  </g>
</svg>
